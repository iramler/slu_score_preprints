name: Quarto Publish

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages (if using renv)
        run: |
          Rscript -e 'if (file.exists("renv.lock")) install.packages("renv"); if (file.exists("renv.lock")) renv::restore()'

      - name: Render Quarto site
        run: quarto render

      - name: Commit and push rendered site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          git commit -m "Automated render and deploy [skip ci]" || echo "No changes to commit"
          git push origin main
