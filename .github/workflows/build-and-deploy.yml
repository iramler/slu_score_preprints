name: Render and Deploy Website

on:
  push:
    branches: [main]

jobs:
  render-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::fs
            any::glue
            any::lubridate
            any::SimplyAgree
            any::DescTools
            any::fmsb
            any::scales
            any::janitor
            any::psych
            any::here
            any::irr
            any::magrittr
            any::flextable
            any::webexercises
            any::rmarkdown
            any::knitr
            any::quarto
            any::vembedr
            any::igraph
            any::netrankr
            any::dunn.test
            any::FSA
            any::reshape2
          cache: true

      - name: Build sport and sidebar pages
        run: Rscript build_sport_pages.R && Rscript build_sidebar_yaml.R

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
